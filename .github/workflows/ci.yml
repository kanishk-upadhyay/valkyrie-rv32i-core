name: Valkyrie-RV32I Core CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  regression-tests:
    name: RTL Simulation & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Hardware Toolchain (Icarus Verilog & Yosys)
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys

      - name: Display Toolchain Versions
        run: |
          iverilog -V | head -n 2
          yosys -V
          python3 --version

      - name: Run Valkyrie-RV32I Regression Suite (13 Test Suites)
        run: |
          python3 tb/sim_runner.py --vcd

      - name: Run Open-Source Silicon Synthesis & PPA Benchmark
        run: |
          cd sim
          make synth

      - name: Upload Waveform & Synthesis Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valkyrie-artifacts
          path: |
            sim/*.vcd
            sim/synth.log
          retention-days: 7
